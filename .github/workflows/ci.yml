name: constitutional-validation

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run constitutional tests
        run: node --test 'tests/**/*.test.js'
      - name: Check the living record's constitutional conformance
        run: node tools/conformance.js laboratory/record
