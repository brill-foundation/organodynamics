<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organodynamics — The Laboratory</title>
<meta name="description" content="Home — the desk from which everything begins, and the World seen through the Window.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0d;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { overflow: hidden; }

  /* The Home — a full-bleed view of the desk, the Window, and the World. */
  .home { position: fixed; inset: 0; width: 100vw; height: 100vh;
    object-fit: cover; object-position: center; display: block; user-select: none; -webkit-user-drag: none; }

  /* The Beacons layer. Colour marks kind: blue = a Place in our git, yellow = the Internet, grey = no target yet. */
  .layer { position: fixed; inset: 0; pointer-events: none; }
  .beacon { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; width: 24px; height: 24px; cursor: pointer; }
  body.mode-arrange .beacon { cursor: grab; }
  body.mode-arrange .beacon.locked { cursor: pointer; }
  .beacon.dragging { cursor: grabbing; }
  .beacon .ring { position: absolute; left: 50%; top: 50%; width: 24px; height: 24px;
    transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(255,255,255,.4); }
  .beacon .dot { position: absolute; left: 50%; top: 50%; width: 13px; height: 13px;
    transform: translate(-50%, -50%); border-radius: 50%; }
  .beacon.kind-web .dot { background: radial-gradient(circle at 50% 40%, #fff 0%, #ffe6a8 34%, #ffb443 66%, rgba(255,150,40,0) 70%);
    box-shadow: 0 0 12px 3px rgba(255,180,80,.8), 0 0 2px 1px rgba(0,0,0,.55); }
  .beacon.kind-git .dot { background: radial-gradient(circle at 50% 40%, #fff 0%, #cfe6ff 34%, #4aa3ff 66%, rgba(60,150,255,0) 70%);
    box-shadow: 0 0 12px 3px rgba(80,160,255,.8), 0 0 2px 1px rgba(0,0,0,.55); }
  .beacon.kind-none .dot { background: radial-gradient(circle at 50% 40%, #cdd2d8 0%, #7d838d 42%, rgba(110,118,130,0) 70%);
    box-shadow: 0 0 8px 2px rgba(120,130,145,.5), 0 0 2px 1px rgba(0,0,0,.55); }
  .beacon .label { position: absolute; left: 50%; top: calc(50% + 17px); transform: translateX(-50%);
    white-space: nowrap; background: rgba(10,10,14,.74); color: #f2efe9; font-size: 12px; line-height: 1;
    padding: 5px 9px; border-radius: 999px; opacity: 0; transition: opacity .15s; pointer-events: none;
    -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .beacon:hover .label, .beacon.selected .label { opacity: 1; }
  .beacon.selected .ring { border-color: #ffd27a; box-shadow: 0 0 0 2px rgba(255,210,122,.5); }

  /* Toolbar */
  .toolbar { position: fixed; left: 16px; bottom: 16px; z-index: 12; display: flex; gap: 8px; align-items: center; }
  .btn { background: rgba(10,10,14,.72); color: #f2efe9; border: 1px solid rgba(255,255,255,.18);
    border-radius: 999px; padding: 9px 15px; font: inherit; font-size: 13px; cursor: pointer;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .btn:hover { background: rgba(34,34,40,.85); }
  .btn.small { padding: 8px 13px; }

  /* The add-menu — points one can add. */
  .addwrap { position: relative; }
  .addmenu { position: absolute; left: 0; bottom: 44px; width: 216px; max-height: min(66vh, 520px); overflow-y: auto;
    background: rgba(18,18,24,.98); border: 1px solid rgba(255,255,255,.16); border-radius: 10px; padding: 6px; z-index: 20;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); }
  .mhead { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; opacity: .55; padding: 8px 9px 4px; }
  .mhead.kind-git { color: #8fc2ff; } .mhead.kind-web { color: #ffd27a; }
  .mitem { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: transparent;
    border: 0; font: inherit; font-size: 13px; color: #eee; padding: 7px 9px; border-radius: 7px; cursor: pointer; }
  .mitem:hover { background: rgba(255,255,255,.09); }
  .mitem::before { content: ""; width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .mitem.kind-git::before { background: #4aa3ff; box-shadow: 0 0 6px 1px rgba(80,160,255,.6); }
  .mitem.kind-web::before { background: #ffb443; box-shadow: 0 0 6px 1px rgba(255,180,80,.6); }
  .mitem.kind-none::before { background: #808894; box-shadow: 0 0 6px 1px rgba(120,130,145,.5); }
  .addmenu .sep { height: 1px; background: rgba(255,255,255,.12); margin: 6px 4px; }

  /* The editor — opens on a point, on click. */
  .editor { position: fixed; z-index: 13; width: min(248px, calc(100vw - 24px)); box-sizing: border-box;
    background: rgba(12,12,16,.9); border: 1px solid rgba(255,255,255,.16); border-radius: 11px; padding: 11px;
    box-shadow: 0 12px 34px rgba(0,0,0,.5); color: #f2efe9;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .editor .erow { display: flex; align-items: center; gap: 8px; }
  .editor .erow.between { justify-content: space-between; margin-top: 10px; }
  .swatch { width: 12px; height: 12px; border-radius: 50%; flex: 0 0 auto; }
  .swatch.kind-web { background: radial-gradient(circle at 50% 40%, #fff 0%, #ffe6a8 34%, #ffb443 66%, rgba(255,150,40,.15) 72%); box-shadow: 0 0 6px 1px rgba(255,180,80,.6); }
  .swatch.kind-git { background: radial-gradient(circle at 50% 40%, #fff 0%, #cfe6ff 34%, #4aa3ff 66%, rgba(60,150,255,.15) 72%); box-shadow: 0 0 6px 1px rgba(80,160,255,.6); }
  .swatch.kind-none { background: radial-gradient(circle at 50% 40%, #cdd2d8 0%, #7d838d 44%, rgba(110,118,130,.15) 72%); box-shadow: 0 0 6px 1px rgba(120,130,145,.5); }
  .iname { flex: 1; min-width: 0; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.16);
    color: #fff; border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 13px; }
  .itarget { width: 100%; box-sizing: border-box; margin-top: 8px; background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.14); color: #d8d4cc; border-radius: 7px; padding: 6px 8px; font: inherit; font-size: 12px; }
  .epin { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.18); color: #eee; border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; }
  .epin .pin { display: inline-block; transition: transform .15s, opacity .15s; }
  .epin:not(.pinned) .pin { opacity: .4; transform: rotate(42deg); }
  .epin.pinned .pin { opacity: 1; transform: rotate(0deg); }
  .edel { background: transparent; border: 1px solid rgba(255,120,120,.5); color: #ff9b9b;
    border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12px; cursor: pointer; }
  .edel:hover { background: rgba(255,90,90,.14); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<!--
  The Home, with Beacons living directly on the scene.

  Points sit on the cover image itself — there is no roster. The + Add menu is
  a reservoir: it lists only the points NOT yet on the page (Places in our git
  are blue, places on the Internet are yellow — the colour is read from the
  target). Placing a point moves it out of the menu and onto the scene;
  deleting it from the scene returns it to the menu. Editing a point is a small
  menu that opens on the point when you click it: rename, set a target, pin in
  place (📌), or delete. A point returns to the same spot on the next visit.

  Persistence is the browser's localStorage — private to this browser, not
  committed and not part of the Record. A working experience, held provisional.
-->
<img class="home" src="assets/images/workspace.webp"
     alt="A workspace at dusk. A person sits at a desk before a wide window — a laptop, an open notebook, a warm cup — looking out over a vast, luminous city of domes, waterways, gardens, and a great living library. The World, seen through the Window.">

<div class="layer" id="layer"></div>

<div class="toolbar">
  <div class="addwrap">
    <button class="btn small" id="addBtn">+ Add</button>
    <div class="addmenu" id="addMenu" hidden></div>
  </div>
  <button class="btn" id="modeBtn">Live</button>
</div>

<div class="editor" id="editor" hidden>
  <div class="erow">
    <span class="swatch" id="eSwatch"></span>
    <input class="iname" id="eName" type="text" placeholder="(unnamed)" autocomplete="off">
  </div>
  <input class="itarget" id="eTarget" type="text" list="places" placeholder="Target — URL or Place" autocomplete="off">
  <div class="erow between">
    <button class="epin" id="ePin"><span class="pin">📌</span><span id="ePinTxt">Pin</span></button>
    <button class="edel" id="eDel">Delete</button>
  </div>
</div>

<datalist id="places"></datalist>

<script>
(function () {
  const KEY = 'brill.home.v1';

  const GIT = [
    { name: 'The Laboratory — the Table', target: 'laboratory/table/' },
    { name: 'The Record — the Sessions', target: 'laboratory/record/' },
    { name: 'The Constitution', target: 'constitution/' },
    { name: 'The RFCs', target: 'rfcs/' },
    { name: 'The Cabinet', target: 'cabinet/' }
  ];
  const WEB = [
    { name: 'Google', target: 'https://www.google.com' },
    { name: 'Gmail', target: 'https://mail.google.com' },
    { name: 'YouTube', target: 'https://www.youtube.com' },
    { name: 'Google Translate', target: 'https://translate.google.com' },
    { name: 'Google Maps', target: 'https://maps.google.com' },
    { name: 'Wikipedia', target: 'https://www.wikipedia.org' },
    { name: 'Facebook', target: 'https://www.facebook.com' },
    { name: 'Instagram', target: 'https://www.instagram.com' },
    { name: 'WhatsApp', target: 'https://web.whatsapp.com' },
    { name: 'X (Twitter)', target: 'https://x.com' },
    { name: 'LinkedIn', target: 'https://www.linkedin.com' },
    { name: 'Reddit', target: 'https://www.reddit.com' },
    { name: 'ChatGPT', target: 'https://chat.openai.com' },
    { name: 'Claude', target: 'https://claude.ai' },
    { name: 'Spotify', target: 'https://open.spotify.com' },
    { name: 'Netflix', target: 'https://www.netflix.com' }
  ];

  const img = document.querySelector('.home');
  const layer = document.getElementById('layer');
  const addBtn = document.getElementById('addBtn');
  const addMenu = document.getElementById('addMenu');
  const modeBtn = document.getElementById('modeBtn');
  const placesList = document.getElementById('places');
  const editor = document.getElementById('editor');
  const eSwatch = document.getElementById('eSwatch');
  const eName = document.getElementById('eName');
  const eTarget = document.getElementById('eTarget');
  const ePin = document.getElementById('ePin');
  const ePinTxt = document.getElementById('ePinTxt');
  const eDel = document.getElementById('eDel');

  let state = load();
  let selectedId = null;
  const dots = new Map();
  let drag = null;

  function kindOf(t) { if (!t) return 'none'; return /^https?:\/\//i.test(t) ? 'web' : 'git'; }
  function setKind(el, t) { el.classList.remove('kind-git', 'kind-web', 'kind-none'); el.classList.add('kind-' + kindOf(t)); }

  for (const p of GIT.concat(WEB)) { const o = document.createElement('option'); o.value = p.target; o.label = p.name; placesList.appendChild(o); }

  // The menu is the reservoir: catalogue points that are NOT yet on the page.
  function renderMenu() {
    addMenu.innerHTML = '';
    const placed = new Set(state.beacons.map(b => b.target).filter(Boolean));
    for (const [title, items] of [['Our git', GIT], ['The Internet', WEB]]) {
      const avail = items.filter(p => !placed.has(p.target));
      if (!avail.length) continue;
      const h = document.createElement('div'); h.className = 'mhead kind-' + kindOf(items[0].target); h.textContent = title; addMenu.appendChild(h);
      for (const p of avail) { const b = document.createElement('button'); b.className = 'mitem kind-' + kindOf(p.target); b.textContent = p.name; b.addEventListener('click', () => { addBeacon(p.name, p.target, true); renderMenu(); }); addMenu.appendChild(b); }
    }
    const sep = document.createElement('div'); sep.className = 'sep'; addMenu.appendChild(sep);
    const blank = document.createElement('button'); blank.className = 'mitem kind-none'; blank.textContent = 'Blank point'; blank.addEventListener('click', () => addBeacon('', '', false)); addMenu.appendChild(blank);
  }

  function load() {
    try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.beacons)) return { beacons: s.beacons, mode: s.mode || 'arrange' }; } catch (e) {}
    return { beacons: [], mode: 'arrange' };
  }
  function save() { localStorage.setItem(KEY, JSON.stringify(state)); }

  function cover() {
    const nw = img.naturalWidth || 1536, nh = img.naturalHeight || 1024;
    const vw = window.innerWidth, vh = window.innerHeight;
    const scale = Math.max(vw / nw, vh / nh);
    return { scale, ox: (vw - nw * scale) / 2, oy: (vh - nh * scale) / 2, nw, nh };
  }
  function toScreen(x, y) { const c = cover(); return { sx: c.ox + x * c.nw * c.scale, sy: c.oy + y * c.nh * c.scale }; }
  function toImage(cx, cy) { const c = cover(); return { x: clamp((cx - c.ox) / (c.nw * c.scale)), y: clamp((cy - c.oy) / (c.nh * c.scale)) }; }
  function clamp(v) { return Math.max(0, Math.min(1, v)); }
  function newId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function beaconById(id) { return state.beacons.find(b => b.id === id); }

  function render() {
    document.body.classList.toggle('mode-arrange', state.mode === 'arrange');
    modeBtn.textContent = state.mode === 'arrange' ? 'Live' : 'Arrange';
    const ids = new Set(state.beacons.map(b => b.id));
    for (const [id, el] of dots) { if (!ids.has(id)) { el.remove(); dots.delete(id); } }
    for (const b of state.beacons) {
      let el = dots.get(b.id);
      if (!el) { el = makeDot(b); layer.appendChild(el); dots.set(b.id, el); }
      placeDot(el, b);
      setKind(el, b.target);
      el.classList.toggle('locked', !!b.locked);
      el.classList.toggle('selected', b.id === selectedId && state.mode === 'arrange');
      el.querySelector('.label').textContent = b.name || '(unnamed)';
    }
  }
  function placeDot(el, b) { const { sx, sy } = toScreen(b.x, b.y); el.style.left = sx + 'px'; el.style.top = sy + 'px'; }
  function makeDot(b) {
    const el = document.createElement('div');
    el.className = 'beacon';
    el.innerHTML = '<span class="ring"></span><span class="dot"></span><span class="label"></span>';
    el.addEventListener('pointerdown', e => onDown(e, b.id));
    el.addEventListener('click', e => onClick(e, b.id));
    return el;
  }

  function onDown(e, id) {
    if (state.mode !== 'arrange') return;
    const b = beaconById(id);
    selectedId = id; render();
    if (b.locked) { showEditor(b); return; }   // pinned: cannot drag, but can edit
    e.preventDefault();
    dots.get(id).setPointerCapture(e.pointerId);
    editor.hidden = true;
    drag = { id, pid: e.pointerId, moved: false };
  }
  function onClick(e, id) {
    if (state.mode === 'live') { const b = beaconById(id); if (b && b.target) { e.preventDefault(); window.location.href = b.target; } }
  }
  window.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const b = beaconById(drag.id); if (!b) return;
    const p = toImage(e.clientX, e.clientY);
    b.x = p.x; b.y = p.y; drag.moved = true;
    const d = dots.get(drag.id); if (d) { placeDot(d, b); d.classList.add('dragging'); }
  });
  window.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.pid) return;
    const d = dots.get(drag.id); if (d) d.classList.remove('dragging');
    const b = beaconById(drag.id);
    if (drag.moved) save(); else if (b) showEditor(b);   // a tap opens the editor
    drag = null;
  });

  function showEditor(b) {
    editor.hidden = false;
    eName.value = b.name || '';
    eTarget.value = b.target || '';
    setKind(eSwatch, b.target);
    ePin.classList.toggle('pinned', !!b.locked);
    ePinTxt.textContent = b.locked ? 'Pinned' : 'Pin';
    ePin.title = b.locked ? 'Click to unpin' : 'Click to pin in place';
    positionEditor(b);
    eName.focus(); eName.select();
  }
  function positionEditor(b) {
    const { sx, sy } = toScreen(b.x, b.y);
    const w = editor.offsetWidth || 240, h = editor.offsetHeight || 150;
    let left = sx + 18, top = sy + 18;
    if (left + w > window.innerWidth - 8) left = sx - w - 18;
    if (left < 8) left = 8;
    if (top + h > window.innerHeight - 8) top = window.innerHeight - h - 8;
    if (top < 8) top = 8;
    editor.style.left = left + 'px'; editor.style.top = top + 'px';
  }

  eName.addEventListener('input', () => { const b = beaconById(selectedId); if (b) { b.name = eName.value; save(); const d = dots.get(b.id); if (d) d.querySelector('.label').textContent = b.name || '(unnamed)'; } });
  eTarget.addEventListener('input', () => { const b = beaconById(selectedId); if (b) { b.target = eTarget.value; save(); const d = dots.get(b.id); if (d) setKind(d, b.target); setKind(eSwatch, b.target); } });
  ePin.addEventListener('click', () => {
    const b = beaconById(selectedId); if (!b) return;
    b.locked = !b.locked; save();
    ePin.classList.toggle('pinned', b.locked);
    ePinTxt.textContent = b.locked ? 'Pinned' : 'Pin';
    ePin.title = b.locked ? 'Click to unpin' : 'Click to pin in place';
    const d = dots.get(b.id); if (d) d.classList.toggle('locked', b.locked);
  });
  eDel.addEventListener('click', () => { if (selectedId) { state.beacons = state.beacons.filter(x => x.id !== selectedId); selectedId = null; editor.hidden = true; save(); render(); if (!addMenu.hidden) renderMenu(); } });

  addBtn.addEventListener('click', e => { e.stopPropagation(); if (addMenu.hidden) { renderMenu(); addMenu.hidden = false; } else { addMenu.hidden = true; } });
  document.addEventListener('pointerdown', e => {
    if (!addMenu.hidden && !e.target.closest('.addwrap')) addMenu.hidden = true;
    if (e.target.closest('.editor') || e.target.closest('.toolbar') || e.target.closest('.beacon')) return;
    if (selectedId) { selectedId = null; editor.hidden = true; render(); }
  });

  function addBeacon(name, target, keepMenu) {
    const jit = () => 0.5 + (Math.random() - 0.5) * 0.14;
    const b = { id: newId(), x: jit(), y: jit(), name: name || '', target: target || '', locked: false };
    state.beacons.push(b); selectedId = b.id; state.mode = 'arrange';
    if (!keepMenu) addMenu.hidden = true;
    save(); render();
    if (!target) showEditor(b);   // a blank point opens its editor to be filled
  }

  modeBtn.addEventListener('click', () => {
    state.mode = state.mode === 'arrange' ? 'live' : 'arrange';
    if (state.mode === 'live') { selectedId = null; addMenu.hidden = true; editor.hidden = true; }
    save(); render();
  });

  window.addEventListener('resize', () => {
    for (const b of state.beacons) { const el = dots.get(b.id); if (el) placeDot(el, b); }
    if (!editor.hidden && selectedId) { const b = beaconById(selectedId); if (b) positionEditor(b); }
  });

  if (img.complete && img.naturalWidth) render();
  else img.addEventListener('load', render);
  render();
})();
</script>
</body>
</html>
